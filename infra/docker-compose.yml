services:
  app1: &app-config
    image: payment-processor-proxy:0.0.1-SNAPSHOT
    deploy:
      resources:
        limits:
          cpus: "0.7"
          memory: "170MB"
    environment:
      - PAYMENT_GATEWAY_DEFAULT=http://payment-processor-default:8080
      - PAYMENT_GATEWAY_FALLBACK=http://payment-processor-fallback:8080
      - SERVER_ADDRESS_URL=/sockets/app1.sock
      - SUMMARY_SERVICE_URL=/sockets/app2.sock
    volumes:
      - ./sockets:/sockets  # Shared volume for socket files
    networks:
      - backend
      - payment-processor
    restart: unless-stopped

  app2:
    <<: *app-config
    environment:
      - PAYMENT_GATEWAY_DEFAULT=http://payment-processor-default:8080
      - PAYMENT_GATEWAY_FALLBACK=http://payment-processor-fallback:8080
      - SERVER_ADDRESS_URL=/sockets/app2.sock
      - SUMMARY_SERVICE_URL=/sockets/app1.sock

  load-balancer:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./sockets:/sockets  # Same socket volume
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "10MB"
    depends_on:
      - app1
      - app2

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true